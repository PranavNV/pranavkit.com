# Refreshes js/scholar.js from Google Scholar every Monday and commits it if
# anything changed. Scholar sometimes rate-limits GitHub's servers; when that
# happens the run fails, the old file stays, and the site hides citation counts
# once they are more than 45 days old.
name: Update Google Scholar data

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/update_scholar.py
      - run: |
          git config user.name "scholar-bot"
          git config user.email "scholar-bot@users.noreply.github.com"
          git add js/scholar.js
          if ! git diff --cached --quiet; then
            git commit -m "Update Google Scholar data"
            git push
          fi
